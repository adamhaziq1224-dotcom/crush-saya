<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f4">
  <title>saya sebenarnya nak tanya ni...</title>
  <style>
* { box-sizing: border-box; }
:root { color-scheme: light; font-family: 'Segoe UI', sans-serif; color: #582c3c; background: #fff0f4; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(ellipse at 10% 15%, #ffdae6, transparent 55%), radial-gradient(ellipse at 90% 90%, #ffe0e9, transparent 55%), #fff4f7; }
.card { width: min(100%, 460px); text-align: center; padding: 40px 28px 26px; background: #fffdfd; border: 1px solid #fff; border-radius: 32px; box-shadow: 0 20px 70px #a3345812; }
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .18em; color: #9c566d; margin: 0; }
.heart { color: #e44876; font-family: Georgia, serif; font-size: 112px; line-height: 1.25; margin: 14px 0 8px; text-shadow: 0 8px 0 #ffe1e9; animation: beat 2.5s ease-in-out infinite; }
h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(2.6rem, 10vw, 3.6rem); line-height: 1.05; letter-spacing: -.04em; margin: 14px 0 18px; }
.subtitle { color: #875c6b; font-size: 1rem; line-height: 1.6; margin: 0; }
.play-area { position: relative; height: 210px; margin-top: 22px; }
.button { border: 0; border-radius: 100px; min-height: 50px; padding: 14px 26px; font: 600 1rem 'Segoe UI', sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 12px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.yes { position: absolute; left: calc(50% - 117px); top: 80px; width: 130px; background: #ce3563; color: white; box-shadow: 0 7px 18px #ce35632a; }
.yes:hover, .confirm:hover { background: #b42651; }
.no { position: absolute; width: 88px; background: #fbe8ee; color: #895365; user-select: none; }
.no[data-position="0"] { top: 80px; left: calc(50% + 29px); }
.no[data-position="1"] { top: 0; right: 0; }
.no[data-position="2"] { bottom: 0; right: 0; }
.no[data-position="3"] { bottom: 0; left: 0; }
.footnote { color: #946b79; font-size: .75rem; line-height: 1.6; margin: 22px 0 0; }
:focus-visible { outline: 3px solid #8e2750; outline-offset: 5px; }
.back { display: block; width: fit-content; color: #895365; text-decoration: none; font-size: .875rem; padding: 4px 0; }
.small { font-size: 68px; margin: 4px 0 20px; }
.date-card h1 { font-size: clamp(2.5rem, 9vw, 3.2rem); }
form { text-align: left; margin-top: 30px; }
label { display: block; font-size: .875rem; font-weight: 600; margin: 20px 0 9px; }
input { display: block; width: 100%; min-width: 0; min-height: 54px; border: 1px solid #edd2dc; background: #fff8fa; border-radius: 12px; padding: 14px; font: 1rem 'Segoe UI', sans-serif; color: #582c3c; }
input::placeholder { color: #987583; }
.confirm { width: 100%; background: #ce3563; color: white; margin-top: 26px; }
.confirm:disabled { opacity: .65; cursor: default; }
form .footnote { text-align: center; }
.confirmation { background: #fff0f4; padding: 16px; border-radius: 12px; font-size: 1rem; line-height: 1.6; overflow-wrap: anywhere; }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@media (max-width: 360px) { .card { padding: 30px 20px 22px; } }
@media (prefers-reduced-motion: reduce) { .heart { animation: none; } }

[hidden] { display: none !important; }
</style>
</head>
<body>
  <main class="card" id="question-page">
    <p class="eyebrow">saya sebenarnya nak tanya ni...</p>
    <div class="heart" aria-hidden="true">♥</div>
    <h1>Awak suka<br>saya tak ?</h1>
    <p class="subtitle">sebab saya suka awak selama ni...</p>
    <div class="play-area" aria-label="Pilih jawapan awak">
      <a class="button yes" href="#plan">Ya <span aria-hidden="true">♥</span></a>
      <button class="button no" type="button" data-position="0">Tak</button>
    </div>
    <p class="footnote">Dengan sedikit keberanian & sepenuh hati.</p>
  </main>
<main class="card date-card" id="plan-page" hidden>
    <a class="back" href="#question">← Kembali</a>
    <div class="heart small" aria-hidden="true">♥</div>
    <p class="eyebrow">terima kasih kerana terima</p>
    <h1>Jom kita<br>jumpa nak ?</h1>
    <p class="subtitle">masa , tarikh dan tempat yang awak suka <span aria-hidden="true" style="color: #ce3563; font-size: .875rem">♥</span></p>
    <form id="date-form" action="https://formspree.io/f/xeaojven" method="POST">
      <input type="hidden" name="answer" value="Ya">
      <label for="date">pilih tarikh awak selesa</label>
      <input id="date" name="date" type="date" required>
      <label for="time">pilih masa awak selesa</label>
      <input id="time" name="time" type="time" required>
      <label for="location">mana tempat awak suka pergi ?</label>
      <input id="location" name="location" type="text" placeholder="Kafe kegemaran awak, taman…" maxlength="160" required>
      <button class="button confirm" type="submit">kita jumpa ya <span aria-hidden="true">♥</span></button>
      <p id="confirmation" class="confirmation" role="status" hidden></p>
      <p class="footnote">ni rahsia kita kita jer tau . hihi</p>
    </form>
  </main>
<script>
const noButton = document.querySelector('.no');
if (noButton) {
  let position = 0;
  const move = () => {
    position = (position + 1) % 4;
    noButton.dataset.position = String(position);
  };
  noButton.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    move();
  });
  // Keyboard and assistive-technology activation also advance one position.
  noButton.addEventListener('click', (event) => {
    event.preventDefault();
    if (event.detail === 0) move();
  });
}

const form = document.querySelector('#date-form');
if (form) {
  const locationInput = document.querySelector('#location');
  locationInput.addEventListener('input', () => locationInput.setCustomValidity(''));
  const submitButton = form.querySelector('button[type="submit"]');
  let sending = false;
  let sent = false;
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (sending || sent || !form.reportValidity()) return;
    const place = locationInput.value.trim();
    if (!place) {
      locationInput.setCustomValidity('Isi tempat yang awak suka ya.');
      locationInput.reportValidity();
      return;
    }
    const confirmation = document.querySelector('#confirmation');
    const data = new FormData(form);
    data.set('location', place);
    data.set('timezone', Intl.DateTimeFormat().resolvedOptions().timeZone);
    sending = true;
    submitButton.disabled = true;
    submitButton.textContent = 'Sedang menghantar…';
    confirmation.textContent = 'Sedang menghantar pilihan awak…';
    confirmation.hidden = false;
    form.setAttribute('aria-busy', 'true');
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);
    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: data,
        headers: { Accept: 'application/json' },
        signal: controller.signal
      });
      if (!response.ok) throw new Error('Submission failed');
      sent = true;
      confirmation.textContent = 'Terima kasih awak disana.';
      submitButton.textContent = 'Dah hantar ♥';
      form.querySelectorAll('input').forEach((input) => { input.disabled = true; });
    } catch (error) {
      confirmation.textContent = error.name === 'AbortError'
        ? 'Sambungan mengambil masa terlalu lama. Kami belum dapat pastikan pilihan awak diterima. Cuba lagi sebentar ya.'
        : 'Kami belum dapat pastikan pilihan awak diterima. Semak sambungan internet dan cuba lagi ya.';
      submitButton.disabled = false;
      submitButton.textContent = 'Cuba lagi ♥';
    } finally {
      clearTimeout(timeout);
      sending = false;
      form.removeAttribute('aria-busy');
    }
  });
}

const questionPage = document.querySelector('#question-page');
const planPage = document.querySelector('#plan-page');
function showPage() {
  const isPlan = window.location.hash === '#plan';
  questionPage.hidden = isPlan;
  planPage.hidden = !isPlan;
  document.title = isPlan ? "Jom kita jumpa nak ?" : 'saya sebenarnya nak tanya ni...';
  const heading = (isPlan ? planPage : questionPage).querySelector('h1');
  heading.setAttribute('tabindex', '-1');
  heading.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', showPage);
showPage();
</script>
</body>
</html>
